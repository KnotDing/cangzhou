name: Cangzhou checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Fetch verified Kopia and fnpack
        run: ./scripts/fetch-ci-tools.sh
      - name: Run race and real Kopia integration tests
        env:
          CANGZHOU_TEST_KOPIA: ${{ github.workspace }}/tools/kopia
        run: |
          go -C core vet ./...
          go -C core test -race ./...
      - name: Build and inspect FPK
        env:
          FNPACK: ${{ github.workspace }}/tools/fnpack
          KOPIA: ${{ github.workspace }}/tools/kopia
        run: |
          ./scripts/build-fpk.sh
          CANGZHOU_ARCH=arm KOPIA="$GITHUB_WORKSPACE/tools/kopia-arm64" ./scripts/build-fpk.sh
          (version="$(sed -n 's/^version=//p' packaging/fnos/manifest)"; cd artifacts && sha256sum "cangzhou-$version-x86.fpk" "cangzhou-$version-arm.fpk" > SHA256SUMS && sha256sum -c SHA256SUMS)
