name: Remove redundant v0.4.8 source asset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and update v0.4.8 assets
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GITEA_TOKEN:?Missing Gitea token}" "${GITHUB_API_URL:?Missing API URL}" "${GITHUB_REPOSITORY:?Missing repository}"
          [[ "$GITEA_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]
          api="${GITHUB_API_URL%/}/repos/$GITHUB_REPOSITORY"
          tag=v0.4.8
          package=cangzhou-0.4.8-x86.fpk
          source=cangzhou-0.4.8-source.tar.gz
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          umask 077
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$tmp/curl.conf"
          curl --config "$tmp/curl.conf" -fsS "$api/releases/tags/$tag" > "$tmp/release.json"
          release_id="$(jq -er '.id | numbers' "$tmp/release.json")"
          for name in "$package" "$source" SHA256SUMS; do
            url="$(jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].browser_download_url else error("Unexpected assets") end' "$tmp/release.json")"
            curl -fLsS "$url" -o "$tmp/$name"
          done
          python3 - "$tmp/SHA256SUMS" "$package" "$source" <<'PY'
          import pathlib, re, sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          names=[]
          for line in lines:
              m=re.fullmatch(r'([0-9a-f]{64}) [ *]([^/\\]+)',line)
              if not m: raise SystemExit('Invalid checksums')
              names.append(m.group(2))
          if len(names)!=2 or set(names)!={sys.argv[2],sys.argv[3]}: raise SystemExit('Unexpected release assets')
          PY
          (cd "$tmp" && sha256sum -c SHA256SUMS && sha256sum "$package" > SHA256SUMS.new)
          checksum_id="$(jq -er '.assets[] | select(.name == "SHA256SUMS") | .id | numbers' "$tmp/release.json")"
          source_id="$(jq -er --arg name "$source" '.assets[] | select(.name == $name) | .id | numbers' "$tmp/release.json")"
          curl --config "$tmp/curl.conf" -fsS -X DELETE "$api/releases/$release_id/assets/$checksum_id" >/dev/null
          if ! curl --config "$tmp/curl.conf" -fsS -F "attachment=@$tmp/SHA256SUMS.new;filename=SHA256SUMS" "$api/releases/$release_id/assets?name=SHA256SUMS" >/dev/null; then
            curl --config "$tmp/curl.conf" -fsS -F "attachment=@$tmp/SHA256SUMS;filename=SHA256SUMS" "$api/releases/$release_id/assets?name=SHA256SUMS" >/dev/null || true
            exit 1
          fi
          curl --config "$tmp/curl.conf" -fsS -X DELETE "$api/releases/$release_id/assets/$source_id" >/dev/null
